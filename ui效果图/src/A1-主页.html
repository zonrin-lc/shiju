<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>青史生存录 · 帛书版主页</title>
<link rel="stylesheet" href="silk.css">
<style>
#home{ position:absolute; inset:0; }
#home .j1{ left:52px } #home .j2{ left:118px } #home .j3{ left:184px }
#home .j4{ left:250px } #home .j5{ left:316px }

/* 纵向流：头部竖排区 → 简牍 → 难度 → 印 → 落款 */
.wrap{
  position:relative; z-index:2; height:100%;
  display:flex; flex-direction:column;
  padding:50px 20px 16px;
}

/* —— 头部：竖排三列，自右向左起读 —— */
.head{ position:relative; flex:none; height:322px; }
.head .c{ position:absolute; top:6px; writing-mode:vertical-rl; text-orientation:upright; }
.head .c1{ right:2px;  font-size:41px; letter-spacing:.2em;  color:var(--ink-1); line-height:1;
           text-shadow:0 1px 0 rgba(255,255,255,.55); }          /* 青史生存录 */
.head .c2{ right:66px; font-size:11.5px; letter-spacing:.52em; color:var(--ink-3); }  /* 如果你来走这一生 */
.head .c3{ right:100px;font-size:12.5px; letter-spacing:.3em;  color:var(--ink-2); }  /* 题记 */
.head .c3 i{ font-style:normal; color:var(--zhu); }

/* —— 分节题：横排小字 + 细线（竖排题留给内容，题签用横排更省空间） —— */
.sec{
  display:flex; align-items:center; gap:10px; margin:0 0 9px;
  font-size:11.5px; letter-spacing:.42em; color:var(--ink-3);
}
.sec::after{ content:''; flex:1; height:1px; background:var(--jie-c); }

/* —— 简牍 —— */
.pick{ flex:none; display:flex; gap:6px; }
.zhuan.s{ flex:1; height:212px; cursor:pointer; overflow:hidden;
  transition:border-color .18s, transform .18s; }
.zhuan.s .por{ position:absolute; inset:0 0 0 0; background:no-repeat center top/cover; }
/* 局名：简牍原生形态——竖行写在简的左侧，带半透明帛底衬 */
.zhuan.s .nm{
  position:absolute; left:0; top:0; bottom:0; width:26px; z-index:2;
  writing-mode:vertical-rl; text-orientation:upright;
  font-size:13.5px; letter-spacing:.22em; color:var(--ink-1);
  background:linear-gradient(90deg,rgba(234,224,198,.94) 58%,rgba(234,224,198,0));
  padding:9px 0 9px 5px; text-align:start;
}
.zhuan.s.on{ border-color:var(--zhu); box-shadow:0 0 0 1px var(--zhu-w), inset 0 0 0 1px var(--zhu-w); transform:translateY(-4px); }
.zhuan.s .rec{
  position:absolute; bottom:6px; right:5px; z-index:3;
  width:17px; height:17px; border:1px solid var(--zhu); border-radius:1px;
  color:var(--zhu); font-size:9px; line-height:15px; text-align:center;
  background:rgba(255,252,244,.8);
}

/* —— 难度 —— */
.diff{ flex:none; display:flex; gap:8px; }
.df{
  flex:1; height:54px; cursor:pointer; position:relative;
  background:var(--silk-2); border:1px solid var(--silk-4); border-radius:1px;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.df span{ writing-mode:vertical-rl; text-orientation:upright; font-size:15px; letter-spacing:.2em; color:var(--ink-2); }
.df small{ font-size:9px; color:var(--ink-3); letter-spacing:0; }
.df.on{ background:var(--zhu-w); border-color:var(--zhu); }
.df.on span{ color:var(--zhu-d); font-weight:600; }
.df.on small{ color:var(--zhu); }

/* —— 入局：朱文印 —— */
.go{ flex:none; margin-top:auto; display:flex; justify-content:center; padding:22px 0 14px; }
.foot{ flex:none; text-align:center; font-size:10.5px; letter-spacing:.5em; color:var(--ink-3); }
</style>
</head>
<body>
<div class="stage">
  <div class="device">
    <div class="notch"></div>
    <div class="statusbar">
      <span>9:41</span>
      <span class="r">
        <svg width="14" height="11" viewBox="0 0 14 11" fill="#544a37"><path d="M7 9.6 1.2 4.1a8 8 0 0 1 11.6 0Z"/><circle cx="7" cy="4.2" r="1.5" fill="#eae0c6"/></svg>
        <span style="width:20px;height:10px;border:1px solid #8b7f66;border-radius:2px;position:relative;display:inline-block">
          <span style="position:absolute;inset:1px;width:70%;background:#544a37;border-radius:1px;display:block"></span></span>
      </span>
    </div>

    <div id="home">
      <div class="silk"></div>
      <div class="jie j1"></div><div class="jie j2"></div><div class="jie j3"></div>
      <div class="jie j4"></div><div class="jie j5"></div>

      <div class="wrap">
        <!-- 竖排三列：题名 / 副题 / 题记 -->
        <div class="head">
          <div class="c c1 v">青史生存录</div>
          <div class="c c2 v">如果你来走这一生</div>
          <div class="c c3 v">史书已写就<i>每一</i>人的结局</div>
        </div>

        <!-- 简牍：五剧本 -->
        <div class="sec">择 一 局</div>
        <div class="pick">
          <div class="zhuan s on"><span class="hole"></span>
            <div class="por" style="background-image:url('../../qingshi-prototype/assets/char/char_lisi.png')"></div>
            <div class="rec">荐</div><div class="nm">仓鼠之局</div>
          </div>
          <div class="zhuan s"><span class="hole"></span>
            <div class="por" style="background-image:url('../../qingshi-prototype/assets/char/char_jingke.png')"></div>
            <div class="nm">易水寒</div>
          </div>
          <div class="zhuan s"><span class="hole"></span>
            <div class="por" style="background-image:url('../../qingshi-prototype/assets/char/char_hanxin.png')"></div>
            <div class="nm">兵仙之局</div>
          </div>
          <div class="zhuan s"><span class="hole"></span>
            <div class="por" style="background-image:url('../../qingshi-prototype/assets/char/char_xiangyu.png')"></div>
            <div class="nm">霸王之局</div>
          </div>
          <div class="zhuan s"><span class="hole"></span>
            <div class="por" style="background-image:url('../../qingshi-prototype/assets/char/char_chensheng.png')"></div>
            <div class="nm">首义之局</div>
          </div>
        </div>

        <!-- 难度 -->
        <div class="sec" style="margin-top:20px">择 一 难 度</div>
        <div class="diff">
          <div class="df"><span>剧情</span><small>容错高</small></div>
          <div class="df on"><span>普通</span><small>回溯 1 次</small></div>
          <div class="df"><span>硬核</span><small>不可回溯</small></div>
        </div>

        <!-- 入局 -->
        <div class="go"><button class="seal-btn">入　局</button></div>
        <div class="foot">史 实 由 你 落 笔</div>
      </div>
    </div>
  </div>

  <div class="caption"><b>01 · 主页（帛书版）</b>　米黄绢帛 ＋ 朱砂界行 ＋ 竖排题名 ＋ 简牍择局 ＋ 朱印入局</div>
</div>
</body>
</html>
