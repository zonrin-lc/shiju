<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>青史生存录 · 仓鼠之局（原型）</title>
<style>
  :root{
    --bg:#17140f; --panel:#221d15; --panel2:#2a241a; --ink:#e8dfc8; --ink-dim:#a89a7c;
    --zhu:#b0432f; --gold:#c9a959; --qing:#7fa8a0; --orange:#c97a3a;
    --line:#3a3226;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#0d0b08; color:var(--ink);
    font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    display:flex; justify-content:center; overflow:hidden;
  }
  #app{width:100%; max-width:480px; height:100%; background:var(--bg); position:relative;
    display:flex; flex-direction:column; box-shadow:0 0 60px rgba(0,0,0,.8);}

  /* 顶部状态栏 */
  #topbar{padding:10px 14px 8px; border-bottom:1px solid var(--line); background:var(--panel); flex:none}
  #topbar .row{display:flex; align-items:center; justify-content:space-between; gap:8px}
  #chapTitle{font-size:13px; color:var(--ink-dim); letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #menuBtns{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
  /* 小屏（360–420px）：顶栏允许换行，按钮收紧，章节名整行 */
  @media (max-width:420px){
    #topbar{padding:8px 10px 6px}
    #topbar .row{flex-wrap:wrap; gap:6px}
    #chapTitle{max-width:100%; font-size:12px}
    .iconbtn{font-size:11px; padding:3px 7px}
  }
  .iconbtn{background:none; border:1px solid var(--line); color:var(--ink-dim); font-size:12px;
    padding:3px 9px; border-radius:3px; cursor:pointer; font-family:inherit}
  .iconbtn:active{background:var(--panel2)}
  .iconbtn:disabled{opacity:.3; cursor:default}
  #devWrap{margin-top:8px; display:flex; align-items:center; gap:8px}
  #devLabel{font-size:11px; color:var(--ink-dim); white-space:nowrap}
  #devBar{flex:1; height:5px; background:#0d0b08; border-radius:3px; overflow:hidden; position:relative}
  #devFill{height:100%; width:0%; background:var(--qing); transition:width .6s, background .6s}
  #devBand{font-size:11px; white-space:nowrap; min-width:32px; text-align:right}

  /* 主区域 */
  #main{flex:1; overflow-y:auto; padding:26px 22px 20px; scrollbar-width:thin}
  #main::-webkit-scrollbar{width:4px}
  #main::-webkit-scrollbar-thumb{background:var(--line)}

  /* 主页 */
  .homeTitle{font-size:44px; letter-spacing:14px; text-align:center; margin:60px 0 4px; color:var(--ink); font-weight:700}
  .homeSub{text-align:center; color:var(--ink-dim); font-size:14px; letter-spacing:3px; margin-bottom:8px}
  .homeQuote{text-align:center; color:var(--ink-dim); font-size:12px; line-height:2; margin:18px 30px 34px; opacity:.8}
  .diffCard{border:1px solid var(--line); background:var(--panel); border-radius:4px; padding:14px 16px; margin:10px 0; cursor:pointer; transition:border-color .2s}
  .diffCard.sel{border-color:var(--gold); background:var(--panel2)}
  .diffCard .dn{font-size:16px; letter-spacing:4px; color:var(--ink)}
  .diffCard .dd{font-size:12px; color:var(--ink-dim); margin-top:5px; line-height:1.7}
  .bigBtn{display:block; width:100%; margin-top:26px; padding:15px 0; text-align:center;
    background:var(--zhu); color:#f4e9dc; border:none; border-radius:4px; font-size:17px; letter-spacing:8px;
    cursor:pointer; font-family:inherit}
  .bigBtn:active{filter:brightness(1.15)}
  .ghostBtn{display:block; width:100%; margin-top:12px; padding:12px 0; text-align:center; background:none;
    color:var(--ink-dim); border:1px solid var(--line); border-radius:4px; font-size:14px; letter-spacing:4px; cursor:pointer; font-family:inherit}

  /* 章首 */
  .chapKicker{font-size:12px; color:var(--zhu); letter-spacing:3px; margin-bottom:10px}
  .chapHead{font-size:24px; letter-spacing:3px; margin-bottom:22px}
  .seg{font-size:16px; line-height:2.15; margin-bottom:18px; text-align:justify; animation:segIn .5s ease both}
  @keyframes segIn{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  .noteSeg{font-size:13px; line-height:1.9; color:var(--gold); border-left:2px solid var(--gold); padding-left:12px; margin-bottom:18px; animation:segIn .5s ease both}

  /* 事件 */
  .evKicker{font-size:12px; color:var(--ink-dim); letter-spacing:2px; margin-bottom:14px}
  .evTitle{font-size:21px; letter-spacing:2px; margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid var(--line)}

  /* 回合页（行动卡回合制主界面） */
  .roundGuide{font-size:14px; color:var(--ink-dim); line-height:2; margin-bottom:16px}
  .settleEcho{font-size:14px; line-height:2; color:var(--ink); border-left:2px solid var(--qing); padding-left:12px; margin-bottom:18px; animation:segIn .5s ease both}
  .card{display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--line);
    color:var(--ink); padding:12px 14px; margin:8px 0; border-radius:3px; cursor:pointer;
    font-family:inherit; position:relative; transition:border-color .15s}
  .card:active{border-color:var(--gold)}
  .card.key{border-color:var(--gold); background:#2e2718}
  .card.key.passive{cursor:default; opacity:.82}
  .card.key.passive:active{border-color:var(--gold)}
  .card.key.crisis{border-color:var(--zhu); background:#2b1a14}
  .card.locked{opacity:.45; cursor:default}
  .cardKicker{font-size:11px; color:var(--gold); letter-spacing:2px; margin-bottom:5px}
  .card.key.crisis .cardKicker{color:var(--zhu)}
  .cardTitle{font-size:15px; line-height:1.5}
  .cardDesc{font-size:12px; color:var(--ink-dim); margin-top:4px; line-height:1.7}
  .cardBadge{position:absolute; right:10px; top:10px; color:var(--gold); border:1px solid var(--gold);
    border-radius:2px; font-size:11px; padding:1px 5px; opacity:.8}
  .card.key.crisis .cardBadge{color:var(--zhu); border-color:var(--zhu)}
  .cardDim{font-size:11px; color:var(--orange); margin-top:5px}
  .cardLock{font-size:11px; color:var(--zhu); margin-top:5px}

  /* 底部选项区 */
  #options{flex:none; max-height:42vh; overflow-y:auto; scrollbar-width:thin; padding:12px 16px 18px; border-top:1px solid var(--line); background:var(--panel)}
  .opt{display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--line);
    color:var(--ink); padding:13px 15px; margin:8px 0; border-radius:3px; font-size:15px; line-height:1.6;
    cursor:pointer; font-family:inherit; position:relative; transition:border-color .15s}
  .opt:active{border-color:var(--gold)}
  .opt .histmark{position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--ink-dim); opacity:.45; font-size:12px; border:1px solid var(--line); border-radius:2px; padding:1px 5px}
  .opt.locked{opacity:.42; cursor:default}
  .opt .lockreason{display:block; font-size:11px; color:var(--zhu); margin-top:4px}
  .opt.risky{border-color:var(--orange); background:#2b2114}
  .opt .riskline{display:block; font-size:11px; color:var(--orange); margin-top:4px}
  .card.risky{border-color:var(--orange); background:#2b2114}
  .card .riskline{display:block; font-size:11px; color:var(--orange); margin-top:4px}
  .contBtn{display:block; width:100%; padding:13px 0; background:none; border:1px dashed var(--line);
    color:var(--ink-dim); border-radius:3px; font-size:14px; letter-spacing:6px; cursor:pointer; font-family:inherit; animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  /* 结算浮层 */
  #overlay{position:absolute; inset:0; background:rgba(10,8,5,.82); display:flex; align-items:flex-end; z-index:20}
  #settleCard{width:100%; background:var(--panel); border-top:2px solid var(--gold); padding:22px 22px 20px; animation:up .35s ease both}
  @keyframes up{from{transform:translateY(40px); opacity:0}to{transform:none; opacity:1}}
  #settleText{font-size:15px; line-height:2.05; text-align:justify; margin-bottom:16px}
  .chg{font-size:14px; margin:5px 0; animation:segIn .3s ease both}
  .chg .plus{color:#8fae7c}.chg .minus{color:var(--zhu)}
  .chg .dev{color:var(--gold)}
  .chg .note{color:var(--ink-dim); font-size:12px; margin-left:8px}
  #achPop{font-size:13px; color:var(--gold); border:1px dashed var(--gold); padding:6px 10px; margin-top:10px; display:inline-block}
  #bandWarn{margin-top:10px; font-size:13px; color:var(--orange)}

  /* 属性面板抽屉 */
  #drawer{position:absolute; inset:0; z-index:30; display:none}
  #drawer.open{display:block}
  #drawerMask{position:absolute; inset:0; background:rgba(10,8,5,.6)}
  #drawerBody{position:absolute; right:0; top:0; bottom:0; width:78%; max-width:330px; background:var(--panel);
    border-left:1px solid var(--line); padding:24px 20px; overflow-y:auto}
  #drawerBody h3{font-size:15px; letter-spacing:4px; color:var(--ink-dim); margin-bottom:18px; font-weight:normal}
  .attrRow{margin-bottom:15px}
  .attrRow .lab{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px}
  .attrRow .lab .val{color:var(--ink-dim)}
  .attrBar{height:4px; background:#0d0b08; border-radius:2px; overflow:hidden}
  .attrBar i{display:block; height:100%; background:var(--qing)}
  .attrBar.inv i{background:var(--zhu)}
  #drawerMeta{margin-top:20px; font-size:12px; color:var(--ink-dim); line-height:2; border-top:1px solid var(--line); padding-top:14px}
  #achList span{display:inline-block; border:1px solid var(--gold); color:var(--gold); font-size:11px; padding:2px 8px; margin:3px 4px 0 0; border-radius:2px}

  /* 结局页 */
  .endSeal{display:inline-block; border:1px solid var(--zhu); color:var(--zhu); font-size:12px; letter-spacing:3px; padding:3px 10px; margin-bottom:14px}
  .endName{font-size:34px; letter-spacing:8px; margin-bottom:20px}
  .endZhuan{font-size:15px; line-height:2.3; text-align:justify; color:var(--ink); background:var(--panel);
    border-left:3px solid var(--gold); padding:18px 18px; margin-bottom:24px}
  .scoreHead{font-size:13px; letter-spacing:4px; color:var(--ink-dim); margin:22px 0 12px}
  #radarWrap{display:flex; justify-content:center; margin:6px 0 14px}
  .scoreLine{display:flex; justify-content:space-between; font-size:13px; padding:6px 2px; border-bottom:1px dashed var(--line)}
  .scoreLine b{color:var(--gold); font-weight:normal}
  #totalLine{display:flex; justify-content:space-between; align-items:baseline; margin-top:16px; padding-top:12px; border-top:1px solid var(--line)}
  #totalScore{font-size:30px; color:var(--gold)}
  #gradeBadge{font-size:30px; color:var(--zhu); border:2px solid var(--zhu); width:58px; height:58px; display:flex; align-items:center; justify-content:center; border-radius:50%}
  .reviewItem{border:1px solid var(--line); border-radius:3px; padding:12px 14px; margin:9px 0; font-size:13px}
  .reviewItem .rn{color:var(--gold); font-size:12px; letter-spacing:2px; margin-bottom:6px}
  .reviewItem .rr{color:var(--ink-dim); line-height:1.9}
  .reviewItem .rr b{color:var(--ink); font-weight:normal}
  .reviewItem .rd{color:var(--gold); font-size:12px; margin-top:4px}
  #epilogue{margin-top:18px; font-size:13px; line-height:2.1; color:var(--ink-dim); border-left:2px solid var(--qing); padding-left:12px}
  .corrTitle{color:var(--orange); font-size:16px; letter-spacing:2px; margin-bottom:16px}

  /* 百科词条（叙事内下划线词条，点按弹卡） */
  .gloss{border-bottom:1px dotted var(--gold); color:var(--gold); cursor:pointer}
  #glossMask{position:absolute; inset:0; background:rgba(10,8,5,.7); z-index:40; display:none}
  #glossMask.open{display:flex; align-items:center; justify-content:center}
  #glossCard{width:82%; max-width:340px; background:var(--panel); border:1px solid var(--gold); padding:20px 20px 16px; animation:up .25s ease both}
  #glossCard .gt{font-size:18px; color:var(--gold); letter-spacing:4px; margin-bottom:12px}
  #glossCard .gb{font-size:14px; line-height:2; text-align:justify; color:var(--ink)}
  #glossCard .gnew{margin-top:12px; font-size:12px; color:var(--qing)}
  #glossCard .gbtn{margin-top:14px; width:100%; padding:9px 0; background:none; border:1px solid var(--line); color:var(--ink-dim); letter-spacing:6px; cursor:pointer; font-family:inherit}

  /* 图鉴抽屉 */
  .glossItem{display:block; width:100%; text-align:left; background:none; border:1px solid var(--line); color:var(--ink); padding:9px 12px; margin:6px 0; font-size:13px; cursor:pointer; font-family:inherit}
  .glossItem.glocked{opacity:.35; cursor:default}
  /* 关键 NPC 出场立绘（char/ 目录，按 ⟦词条⟧ 扫描挂载） */
  #glossChar{width:72px;height:72px;border-radius:50%;border:2px solid var(--gold);display:block;margin:0 auto 10px;object-fit:cover}
  .castRow{display:flex;flex-wrap:wrap;gap:12px;margin:4px 0 6px}
  .castChip{background:none;border:none;padding:0;cursor:pointer;text-align:center;font-family:inherit}
  .castChip img{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);display:block;object-fit:cover}
  .castChip span{display:block;font-size:11px;color:var(--ink-dim);margin-top:3px;letter-spacing:1px}

  /* 偏离度升段全屏边缘色光（GDD 6.3） */
  #bandFlash{position:absolute; inset:0; pointer-events:none; z-index:15; opacity:0}
  #bandFlash.on{animation:bandGlow 1.4s ease both}
  @keyframes bandGlow{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

  /* 章末结算页 */
  .sumEmpty{font-size:13px; color:var(--ink-dim); line-height:2; border-left:2px solid var(--qing); padding-left:12px; margin-bottom:16px}

  /* 结局分享卡（GDD 11.3） */
  #shareMask{position:absolute; inset:0; background:rgba(10,8,5,.85); z-index:45; display:none}
  #shareMask.open{display:flex; align-items:center; justify-content:center}
  #shareCard{width:86%; max-width:340px; text-align:center}
  #shareImg{width:100%; border:1px solid var(--gold); display:block}
  /* === 美术资产接入 (B1-B5) === */
  #app.home-hero::before{content:'';position:absolute;left:0;right:0;top:0;height:44vh;
    background:url('assets/bg/bg_home_hero.jpg') center 30%/cover no-repeat;pointer-events:none;z-index:0;
    -webkit-mask-image:linear-gradient(#000 52%,transparent);mask-image:linear-gradient(#000 52%,transparent)}
  #main{position:relative;z-index:1}
  .endSealBox{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .endSealBox .sealImg{width:96px;height:auto;border-radius:2px}
  .endSealBox .sealMeta{font-size:12px;color:var(--zhu);letter-spacing:2px}
  #devSeal{width:20px;height:20px;border-radius:50%;flex:none}
  .attrIcon{width:20px;height:20px;border-radius:50%;vertical-align:-4px;margin-right:6px}
  #achList span{display:inline-flex;align-items:center;gap:5px}
  .achIcon{width:22px;height:22px;border-radius:50%}
  #app::before{content:'';position:absolute;inset:0;background:url('assets/text/tex_bamboo.png') repeat;opacity:.5;pointer-events:none;z-index:0}
</style>
</head>
<body>
<div id="app">
  <div id="topbar" style="display:none">
    <div class="row">
      <span id="chapTitle"></span>
      <span id="menuBtns">
        <button class="iconbtn" id="btnTts" title="朗读开关">🔇</button>
        <button class="iconbtn" id="btnTtsRate" title="语速" style="display:none">常</button>
        <button class="iconbtn" id="btnAttrs">属性</button>
        <button class="iconbtn" id="btnGloss">图鉴</button>
        <button class="iconbtn" id="btnBack">回溯</button>
      </span>
    </div>
    <div id="devWrap">
      <img id="devSeal" alt="">
      <span id="devLabel">偏离度</span>
      <div id="devBar"><div id="devFill"></div></div>
      <span id="devBand"></span>
    </div>
  </div>
  <div id="main"></div>
  <div id="options"></div>
  <div id="overlay" style="display:none">
    <div id="settleCard">
      <div id="corrTitleBox"></div>
      <div id="settleText"></div>
      <div id="chgList"></div>
      <div id="achPop" style="display:none"></div>
      <div id="bandWarn" style="display:none"></div>
      <button class="bigBtn" id="settleContinue" style="letter-spacing:6px; margin-top:18px; padding:12px 0; font-size:15px">继 续</button>
    </div>
  </div>
  <div id="drawer">
    <div id="drawerMask"></div>
    <div id="drawerBody">
      <h3>属 性 面 板</h3>
      <div id="attrList"></div>
      <div id="drawerMeta"></div>
      <h3 style="margin-top:22px">成 就</h3>
      <div id="achList"></div>
    </div>
  </div>
  <div id="bandFlash"></div>
  <div id="glossMask">
    <div id="glossCard">
      <div class="gt" id="glossTerm"></div>
      <img id="glossChar" style="display:none" alt="">
      <div class="gb" id="glossBody"></div>
      <div class="gnew" id="glossNew" style="display:none">已录入图鉴</div>
      <button class="gbtn" id="glossClose">收 起</button>
    </div>
  </div>
  <div id="shareMask">
    <div id="shareCard">
      <img id="shareImg" alt="结局分享卡">
      <a id="shareDl" class="sbtn" download="青史生存录-结局.png">保 存 图 片</a>
      <button class="sbtn" id="shareClose">收 起</button>
    </div>
  </div>
</div>
<script src="game-data.js"></script>
<script src="jingke-data.js"></script>
<script src="hanxin-data.js"></script>
<script src="xiangyu-data.js"></script>
<script src="chensheng-data.js"></script>
<script src="engine.js"></script>
<script>
(function(){
  var D = window.GAME_DATA, E = window.QINGSHI_ENGINE;
  /* 剧本注册表（多剧本架构）：key = 剧本 id */
  var SCENARIOS = { lisi: window.GAME_DATA, jingke: window.JINGKE_DATA, hanxin: window.HANXIN_DATA, xiangyu: window.XIANGYU_DATA, chensheng: window.CHENSHENG_DATA };
  var selScen = 'lisi', selDiff = 'normal';
  function scenId(){ return game ? game.d.SCENARIO.id : selScen; }
  var game = null;
  var main = document.getElementById('main');
  var optBox = document.getElementById('options');
  var overlay = document.getElementById('overlay');
  var lastSettleText = null;   // 最近一次结算叙事（行动 res / 事件 res），回合页主区回显

  /* 美术资产映射与预加载 */
  var SEAL_IMG = {'循史':'seal_xunshi','苟活':'seal_gouhuo','稳健':'seal_wenjian','逆天':'seal_nitian','败局':'seal_baiju'};
  var shareBg = new Image(); shareBg.src = 'assets/bg/bg_share.jpg';

  function el(tag, cls, html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  /* 叙事富文本：⟦词条⟧ → 可点按的百科入口 */
  function rich(s){ return esc(s).replace(/⟦(.+?)⟧/g, '<span class="gloss" data-t="$1">$1</span>'); }

  /* 关键 NPC 立绘（assets/char/char_<id>.png）：NPC 名 → 文件 id */
  var CHAR_IMG = {
    '李斯':'lisi','荆轲':'jingke','韩信':'hanxin','项羽':'xiangyu','陈胜':'chensheng',
    '吴广':'wuguang','范增':'fanzeng','樊於期':'fanwuqi','扶苏':'fusu','高渐离':'gaojianli',
    '韩非':'hanfei','胡亥':'huhai','季布':'jibu','蒯通':'kuaitong','刘邦':'liubang',
    '李左车':'lizuoche','龙且':'longju','蒙恬':'mengtian','漂母':'piaomu','秦舞阳':'qinwuyang',
    '太子丹':'taizidan','田光':'tianguang','王翦':'wangjian','武臣':'wuchen','项伯':'xiangbo',
    '项梁':'xiangliang','萧何':'xiaohe','嬴政':'yingzheng','虞姬':'yuji','章邯':'zhanghan',
    '赵高':'zhaogao','郑国':'zhengguo','钟离眜':'zhonglimei'
  };

  /* 「出场」立绘排：扫描叙事文本中的 ⟦NPC⟧，有立绘者在标题下出一排圆像（点按开百科弹卡） */
  function renderCast(strs){
    var seen = {}, names = [];
    (strs || []).forEach(function(s){
      var re = /⟦(.+?)⟧/g, m;
      while ((m = re.exec(s))) { var t = m[1]; if (CHAR_IMG[t] && !seen[t]) { seen[t] = 1; names.push(t); } }
    });
    if (!names.length) return null;
    var row = el('div','castRow');
    names.forEach(function(t){
      var chip = el('button','castChip');
      chip.innerHTML = '<img src="assets/char/char_'+CHAR_IMG[t]+'.png" alt="'+esc(t)+'"><span>'+esc(t)+'</span>';
      if (game.d.GLOSSARY && game.d.GLOSSARY[t]) chip.onclick = function(){ showGloss(t); };
      row.appendChild(chip);
    });
    return row;
  }
  function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); if (n === main) cancelReveal(); }

  /* 防连点：点击即禁用当前选项区全部按钮（下一次渲染会重建新按钮，无需解锁） */
  function disableOpts(){ var bs = optBox.querySelectorAll('button'); for (var i = 0; i < bs.length; i++) bs[i].disabled = true; }

  /* ---------- 叙事逐句渐显（v1.5）：文本从底部区域一句一句出现；点击正文区（非词条/立绘/按钮）速显全部 ---------- */
  var SEG_DELAY = 650;   // 每句间隔（ms）
  var revealing = null;  // 进行中的渐显 {cancel}
  function cancelReveal(){ if (revealing){ revealing.cancel(); } if (typeof main !== 'undefined' && main) main.onclick = null; }
  function revealSegs(items, done){
    // items: [{cls, html}]；逐条追加到 main 并滚到底部；全部显完（或速显）后调 done
    cancelReveal();
    var i = 0, timer = null;
    function flush(){ while (i < items.length){ var it = items[i++]; main.appendChild(el('div', it.cls, it.html)); } main.scrollTop = main.scrollHeight; }
    function step(){
      if (i >= items.length){ revealing = null; main.onclick = null; if (done) done(); return; }
      var it = items[i++];
      main.appendChild(el('div', it.cls, it.html));
      main.scrollTop = main.scrollHeight;   // 新句从底部区域出现
      timer = setTimeout(step, SEG_DELAY);
    }
    revealing = { cancel: function(){ clearTimeout(timer); flush(); revealing = null; main.onclick = null; if (done) done(); } };
    main.onclick = function(e){
      if (!revealing) return;
      if (e.target && e.target.closest && e.target.closest('.gloss,.castChip,button,a')) return;
      revealing.cancel();
    };
    step();   // 首句即显
  }

  /* 收集品（图鉴/成就）跨局持久化（按剧本分区） */
  function loadCollection(){
    try { var c = JSON.parse(localStorage.getItem('qingshi_collection_v1_' + scenId())); if (c && c.gloss && c.ach) return c; } catch(e){}
    return { gloss: [], ach: [] };
  }
  function saveCollection(){
    if (!game) return;
    try { localStorage.setItem('qingshi_collection_v1_' + game.d.SCENARIO.id, JSON.stringify({ gloss: game.gloss, ach: game.ach })); } catch(e){}
  }

  /* 跨会话存档（GDD 6.4）：章首存档点，引擎 exportSave/importSave 出纯数据，存取归 UI（按剧本分区） */
  function saveGame(){
    if (!game) return;
    var sv = game.exportSave();   // 硬核/无快照返回 null，不写
    if (sv) try { localStorage.setItem('qingshi_save_v1_' + game.d.SCENARIO.id, JSON.stringify(sv)); } catch(e){}
  }
  function loadGameSave(){
    try { var s = JSON.parse(localStorage.getItem('qingshi_save_v1_' + scenId())); if (s && s.diffKey && s.snapshot) return s; } catch(e){}
    return null;
  }
  function clearGameSave(){ try { localStorage.removeItem('qingshi_save_v1_' + scenId()); } catch(e){} }

  /* ---------- 配音朗读（Web Speech API；不支持时按钮隐藏、全域静默降级） ---------- */
  var tts = {
    supported: (typeof window.speechSynthesis !== 'undefined') && (typeof window.SpeechSynthesisUtterance !== 'undefined'),
    on: false, rate: 1.1
  };
  var TTS_KEY = 'qingshi_tts_v1';
  (function loadTts(){
    try {
      var s = JSON.parse(localStorage.getItem(TTS_KEY));
      if (s){ tts.on = !!s.on; if (s.rate === 0.9 || s.rate === 1.1) tts.rate = s.rate; }
    } catch(e){}
  })();
  function saveTts(){ try { localStorage.setItem(TTS_KEY, JSON.stringify({ on: tts.on, rate: tts.rate })); } catch(e){} }
  function ttsCancel(){ if (tts.supported) try { window.speechSynthesis.cancel(); } catch(e){} }
  function ttsSpeak(text){
    if (!tts.supported || !tts.on || !text) return;
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN'; u.rate = tts.rate;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch(e){}
  }
  /* 朗读当前叙事页：拼接主区可见纯文本（跳过按钮；选项区在 #options，天然不入） */
  function speakMain(){
    if (!tts.on) return;
    var parts = [];
    for (var i = 0; i < main.children.length; i++){
      var n = main.children[i];
      if (n.tagName === 'BUTTON') continue;
      var t = n.textContent;
      if (t) parts.push(t);
    }
    ttsSpeak(parts.join('。'));
  }
  function refreshTtsBtns(){
    var bT = document.getElementById('btnTts'), bR = document.getElementById('btnTtsRate');
    if (!tts.supported){ bT.style.display='none'; bR.style.display='none'; return; }
    bT.textContent = tts.on ? '🔊' : '🔇';
    bR.style.display = tts.on ? '' : 'none';
    bR.textContent = tts.rate < 1 ? '慢' : '常';
  }
  document.getElementById('btnTts').onclick = function(){
    tts.on = !tts.on; saveTts(); refreshTtsBtns();
    if (tts.on) speakMain(); else ttsCancel();
  };
  document.getElementById('btnTtsRate').onclick = function(){
    tts.rate = (tts.rate < 1) ? 1.1 : 0.9;   // 两档循环：慢 0.9 / 常 1.1
    saveTts(); refreshTtsBtns();
  };

  /* 升段史书提示（GDD 6.3）：按升到的偏离段区分文案（循史为最低段，不会触发升段） */
  var BAND_WARNS = {
    '微澜': '史书提示：偏离度已入「微澜」——史书的正文尚未改，页边已多了几行你的批注。',
    '改流': '史书提示：偏离度已入「改流」——河已改道，史官的笔开始跟不上你了。',
    '逆天': '史书提示：偏离度已入「逆天」——这是一段无人见过的新历史，天命将以反噬索价。'
  };
  function newGame(scenKey, diffKey){
    game = new E.Game(SCENARIOS[scenKey], diffKey);
    var col = loadCollection();
    game.gloss = col.gloss.slice();
    game.ach = col.ach.slice();
    return game;
  }

  /* ---------- 主页 ---------- */
  function renderHome(){
    ttsCancel();
    document.getElementById('topbar').style.display='none';
    document.getElementById('app').classList.add('home-hero');
    clear(main); clear(optBox); overlay.style.display='none';
    main.appendChild(el('div','homeTitle','青史生存录'));
    main.children[0].style.cssText = 'font-size:38px;letter-spacing:9px;margin-top:44px';
    main.appendChild(el('div','homeSub','如果你来走这一生 ｜ 原型 v1.0'));
    main.appendChild(el('div','homeSub','—— 选 择 剧 本 ——'));
    var scenCards = [];
    Object.keys(SCENARIOS).forEach(function(k){
      var sc = SCENARIOS[k].SCENARIO;
      var c = el('div','diffCard'+(k===selScen?' sel':''),
        '<div class="dn">'+sc.name+'</div><div class="dd">'+sc.era+' ｜ '+sc.desc+'<br>'+sc.recommend+'</div>');
      var bgMap = {jingke:'assets/bg/bg_card_jingke.jpg',hanxin:'assets/bg/bg_card_hanxin.jpg',xiangyu:'assets/bg/bg_card_xiangyu.jpg',chensheng:'assets/bg/bg_card_chensheng.jpg'};
      if (bgMap[k]){ c.style.backgroundImage='linear-gradient(rgba(23,20,15,.80),rgba(23,20,15,.90)),url("'+bgMap[k]+'")'; c.style.backgroundSize='cover'; c.style.backgroundPosition='center'; }
      c.onclick = function(){ selScen=k; scenCards.forEach(function(x){x.el.className='diffCard';}); c.className='diffCard sel'; renderHome(); };
      scenCards.push({el:c,k:k}); main.appendChild(c);
    });
    main.appendChild(el('div','homeSub','—— 选 择 难 度 ——'));
    var cards = [];
    ['story','normal','hardcore'].forEach(function(k){
      var df = SCENARIOS[selScen].DIFFICULTY[k];
      var c = el('div','diffCard'+(k===selDiff?' sel':''), '<div class="dn">'+df.n+'</div><div class="dd">'+df.desc+'</div>');
      c.onclick = function(){ selDiff=k; cards.forEach(function(x){x.el.className='diffCard';}); c.className='diffCard sel'; };
      cards.push({el:c,k:k}); main.appendChild(c);
    });
    var start = el('button','bigBtn','入 局');
    start.onclick = function(){ clearGameSave(); newGame(selScen, selDiff); game.start(); renderIntro(); };
    main.appendChild(start);
    // 跨会话存档（GDD 6.4）：当前所选剧本有有效存档则给「继续」入口，按存档难度恢复
    var sv = loadGameSave();
    if (sv){
      var SD = SCENARIOS[selScen];
      var svdf = SD.DIFFICULTY[sv.diffKey], svch = SD.CHAPTERS[sv.chapterIdx];
      var svLabel = '继 续 · 本章开局';
      if (svdf && svch) svLabel += '（'+svdf.n+' · '+svch.title.split('｜')[0].trim()+'）';
      var cont = el('button','ghostBtn', esc(svLabel));
      cont.onclick = function(){
        newGame(selScen, sv.diffKey);
        if (game.importSave(sv)) renderIntro();
        else { clearGameSave(); renderHome(); }   // 坏存档：清除并回到主页
      };
      main.appendChild(cont);
    }
  }

  /* ---------- 顶栏 ---------- */
  function refreshTop(){
    document.getElementById('topbar').style.display='';
    document.getElementById('app').classList.remove('home-hero');
    var ch = game.chapter();
    var title = ch ? ch.title : '';
    // 章内进度（GDD 3.3）：回合/事件阶段显示「章节名 · 事件 x/n」，际遇/危机插入不计（引擎口径）
    if (ch && (game.phase === 'round' || game.phase === 'event')){
      var prog = game.chapterProgress();
      title += ' · 事件 ' + prog.done + '/' + prog.total;
    }
    document.getElementById('chapTitle').textContent = title;
    var band = game.devBand();
    var bd = game.d.DEV_BANDS[band];
    var fill = document.getElementById('devFill');
    fill.style.width = game.dev + '%';
    fill.style.background = bd.color;
    var bandEl = document.getElementById('devBand');
    bandEl.textContent = bd.name;
    bandEl.style.color = bd.color;
    document.getElementById('devSeal').src = 'assets/icons/icon_dev' + (band + 1) + '.png';
    var btnB = document.getElementById('btnBack');
    btnB.disabled = !game.canBacktrack();
    btnB.textContent = game.diff.backtrack>0 ? ('回溯 '+ (game.diff.backtrack - game.backtracksThisChapter)) : '回溯';
  }

  /* ---------- 章首叙事（一小节一页：整页一次渲染全部段落，底部一个「继续」进入回合） ---------- */
  function renderIntro(fromBt){
    ttsCancel();
    refreshTop(); clear(main); clear(optBox);
    saveGame();   // 每次进入章首叙事即存档（GDD 6.4；回溯恢复的章首同样覆写，语义一致）
    lastSettleText = null;
    var ch = game.chapter();
    main.appendChild(el('div','chapKicker', ch.sub || ''));
    main.appendChild(el('div','chapHead', ch.title.split('｜')[1] ? ch.title.split('｜')[1].trim() : ch.title));
    var cast0 = renderCast(ch.intro); if (cast0) main.appendChild(cast0);
    var items0 = ch.intro.map(function(s){ return { cls: 'seg', html: rich(s) }; });
    (game.introNotes||[]).forEach(function(n){ items0.push({ cls: 'noteSeg', html: esc(n) }); });
    if (fromBt) items0.push({ cls: 'noteSeg', html: '【回溯】你回到了本章开头。偏离度与已解锁的成就、图鉴不会重置——做过的事，史书都记着。' });
    revealSegs(items0, function(){
      var btn = el('button','contBtn','继 续');
      btn.onclick = function(){ disableOpts(); handleRoute(game.beginEvents()); };   // beginEvents = beginRounds 别名 → {type:'round'}
      optBox.appendChild(btn);
      speakMain();
    });
    main.scrollTop = 0;
  }

  /* ---------- 回合页（行动卡回合制主界面：关键事件卡 ×1 + 行动卡 ×3） ---------- */
  function renderRound(){
    ttsCancel();
    refreshTop(); clear(main); clear(optBox);
    var offer = game.getOffer();
    var key = null;
    offer.forEach(function(e){ if (e.type === 'key') key = e; });
    main.appendChild(el('div','chapKicker', game.chapter().title));
    if (lastSettleText) main.appendChild(el('div','settleEcho', rich(lastSettleText)));
    main.appendChild(el('div','roundGuide',
      '经营以蓄势——关键事件「'+esc(key ? key.title : '')+'」余 '+(key ? key.roundsLeft : 0)+' 轮后自动开启；届时抉择，须你亲定。'+
      (lastSettleText ? '' : '行动卡用完即开。')));
    offer.forEach(function(e, i){
      if (e.type === 'key'){
        // 关键事件卡（v1.5 起被动）：金边（危机插入事件赤边）+ 「史」/「！」徽标 + 倒计时——不可点，行动卡用尽（倒计时归零）自动开启抉择页
        var ev = game.findEvent(e.eventId);
        var isHist = ev && ev.options && ev.options.some(function(o){ return o.hist; });
        var c = el('div','card key passive'+(e.inserted ? ' crisis' : ''));
        c.innerHTML = '<div class="cardKicker">'+(e.inserted ? '危机迫近 · 插入事件' : '关键事件')+' ｜ 余 '+e.roundsLeft+' 轮后开启</div>'+
          '<div class="cardTitle">'+esc(e.title)+'</div>'+
          '<span class="cardBadge">'+(e.inserted || !isHist ? '!' : '史')+'</span>';
        optBox.appendChild(c);
      } else {
        // 行动卡：名称 + desc + 收益递减提示；locked 防御渲染（硬门槛不入池）；risky 险招徽章（属性软门槛）
        var a = e.action;
        var b = el('button','card'+(e.locked ? ' locked' : '')+(e.risky ? ' risky' : ''));
        var h = '<div class="cardTitle">'+esc(a ? a.name : String(e.id))+'</div>';
        if (a && a.desc) h += '<div class="cardDesc">'+esc(a.desc)+'</div>';
        if (e.diminishing) h += '<div class="cardDim">已用 '+e.usedCount+' 次 · 收益递减</div>';
        if (e.locked && e.reason) h += '<div class="cardLock">🔒 '+esc(e.reason)+'</div>';
        if (e.risky) h += '<div class="riskline">'+esc(riskText(e.risky))+'</div>';
        b.innerHTML = h;
        if (!e.locked) b.onclick = function(){ doPlayCard(i); };
        optBox.appendChild(b);
      }
    });
    main.scrollTop = 0;
  }

  /* ---------- 出牌 ---------- */
  function doPlayCard(i){
    disableOpts();
    var r = game.playCard(i);
    if (!r) return;
    if (r.kind === 'key'){ renderEvent(); return; }   // 关键事件卡 → 现有事件决策流
    // 行动卡：先弹行动结算
    lastSettleText = r.text;
    var actTitle = r.risk ? ('🎲 掷骰 '+r.risk.roll+(r.failed?' ＞ ':' ≤ ')+r.risk.rate+(r.failed?' · 败':' · 成')) : '行动';
    showSettle(actTitle, r.text, r.changes, r.devDelta, r.achNew, null, function(){
      if (r.forcedEnding){ handleRoute(game.proceed()); return; }   // 行动致死：phase='settle'，需再 proceed 收束
      if (r.forcedKey){ renderEvent(); return; }   // 倒计时归零：强制进入关键事件，玩家亲自抉择
      handleRoute(r.route || { type: 'round' });
    });
  }

  /* ---------- 事件（整页渲染全部段落，叙事之后直接跟选项区） ---------- */
  function renderEvent(){
    ttsCancel();
    refreshTop(); clear(main); clear(optBox);
    var ev = game.findEvent(game.eventId);
    if (!ev) return;
    main.appendChild(el('div','evKicker', game.currentRandom ? '际遇 · 随机事件' : game.chapter().title.split('｜')[0].trim()));
    main.appendChild(el('div','evTitle', esc(ev.title)));
    var segs = (ev.altSegs && game.flags[ev.altSegs.flag]) ? ev.altSegs.segs : ev.segs;
    var cast1 = renderCast(segs); if (cast1) main.appendChild(cast1);
    revealSegs(segs.map(function(s){ return { cls: 'seg', html: rich(s) }; }), function(){
      renderOptions();
      speakMain();
    });
    main.scrollTop = 0;
  }

  /* 险招（GDD 附录 J）：成功率展示——普通/剧情显示百分比，硬核显示档位词（隐藏数值口径） */
  function riskWord(rate){ return rate>=70?'七成':rate>=50?'五成':rate>=40?'四成':rate>=30?'三成':rate>=20?'二成':'一成五'; }
  function riskText(risky){
    var t = game.diff.hideAttrs ? ('成算 '+riskWord(risky.rate)) : ('成功率 '+risky.rate+'%');
    var gaps = risky.unmet.map(function(u){
      return game.diff.hideAttrs ? u.name+'不足' : (u.name+' '+u.have+'/'+u.need);
    }).join('、');
    return '⚠ 险招 · '+t+'（'+gaps+'）';
  }

  function renderOptions(){
    clear(optBox);
    var opts = game.getOptions();
    opts.forEach(function(o, i){
      var b = el('button','opt'+(o.locked?' locked':'')+(o.risky?' risky':''), esc(o.opt.t));
      if (o.hist) b.appendChild(el('span','histmark','史'));
      if (o.locked && o.reason) b.appendChild(el('span','lockreason','🔒 '+esc(o.reason)));
      if (o.risky) b.appendChild(el('span','riskline', esc(riskText(o.risky))));
      if (!o.locked) b.onclick = function(){ doChoose(i); };
      optBox.appendChild(b);
    });
  }

  /* ---------- 结算 ---------- */
  function doChoose(i){
    disableOpts();
    var r = game.choose(i);
    if (!r) return;
    lastSettleText = r.text;
    var title = r.risk ? ('🎲 掷骰 '+r.risk.roll+(r.risk.success?' ≤ ':' ＞ ')+r.risk.rate+(r.risk.success?' · 成':' · 败')) : '';
    showSettle(title, r.text, r.changes, r.devDelta, r.achNew, r.bandUp ? r.bandName : null, function(){
      if (r.failed){
        if (r.forcedEnding){ routeAfter(); return; }   // 险招失败且惩罚致死：走结局收束
        renderOptions(); return;                        // 失败烧毁该选项，留在本事件改选
      }
      routeAfter();
    });
  }

  function showSettle(title, text, changes, devDelta, achNew, bandName, cb){
    ttsCancel();
    refreshTop();
    document.getElementById('corrTitleBox').innerHTML = title ? '<div class="corrTitle">'+esc(title).replace('🎲','<img src="assets/icons/icon_risk.png" style="width:18px;height:18px;vertical-align:-3px">')+'</div>' : '';
    document.getElementById('settleText').innerHTML = rich(text || '');
    var cl = document.getElementById('chgList'); clear(cl);
    var list = (changes||[]).slice();
    if (devDelta) list.push({dev:true, delta:devDelta});
    list.forEach(function(c, idx){
      var d = el('div','chg');
      d.style.animationDelay = (idx*0.15)+'s';
      if (c.dev){
        d.innerHTML = '<span class="dev">偏离 '+(c.delta>0?'+':'')+c.delta+'</span>';
      } else {
        var cls = c.delta>=0 ? 'plus' : 'minus';
        var inv = (c.k==='weiji');
        if (inv) cls = c.delta>0 ? 'minus' : 'plus';
        if (game.diff.hideAttrs){
          // 硬核（GDD 4.4）：不显示具体数值，以「升/降 + 结算后状态词」呈现；危机为逆向属性，升即恶化
          d.innerHTML = '<span class="'+cls+'">'+esc(c.label)+' '+(c.delta>0?'升':'降')+' · '+esc(game.attrWord(c.k))+'</span>'+(c.note?'<span class="note">'+esc(c.note)+'</span>':'');
        } else {
          d.innerHTML = '<span class="'+cls+'">'+esc(c.label)+' '+(c.delta>0?'+':'')+c.delta+'</span>'+(c.note?'<span class="note">'+esc(c.note)+'</span>':'');
        }
      }
      cl.appendChild(d);
    });
    var ap = document.getElementById('achPop');
    if (achNew){ ap.style.display='inline-block'; ap.textContent = '成就解锁 ｜ '+achNew; } else ap.style.display='none';
    var bw = document.getElementById('bandWarn');
    if (bandName){
      bw.style.display='block'; bw.textContent = BAND_WARNS[bandName] || ('史书提示：偏离度已入「'+bandName+'」段——史官的笔，开始跟不上你了。');
      // 升段全屏边缘色光（GDD 6.3）
      var bd = null;
      game.d.DEV_BANDS.forEach(function(b){ if (b.name === bandName) bd = b; });
      var fl = document.getElementById('bandFlash');
      fl.style.boxShadow = 'inset 0 0 90px 26px ' + (bd ? bd.color : '#c9a959');
      fl.className = ''; void fl.offsetWidth; fl.className = 'on';
    } else bw.style.display='none';
    overlay.style.display='flex';
    var btn = document.getElementById('settleContinue');
    btn.onclick = function(){ overlay.style.display='none'; saveCollection(); cb(); };
  }

  function routeAfter(){
    var n = game.proceed();
    handleRoute(n);
  }

  function handleRoute(n){
    if (!n) return;
    if (n.type === 'round'){
      // 每回合结算后尝试际遇（GDD 4.1/附录C）；resumed 的回合（际遇 RETURN 回来）不重复触发
      if (!n.resumed){
        var rev = game.maybeRandom();
        if (rev){ renderEvent(); return; }   // 际遇触发：phase 已转 'event'，渲染事件页
      }
      renderRound();
    }
    else if (n.type === 'event') renderEvent();
    else if (n.type === 'ending') renderEnding();
    else if (n.type === 'chapter') renderIntro();
    else if (n.type === 'endEvent') renderEndEvent();
    else if (n.type === 'correction') showCorrection(n.correction);
    else if (n.type === 'summary') renderSummary(n.summary);
    else renderRound();
  }

  /* ---------- 章末结算页（GDD 5.4：偏离归因 + 属性总览 + 修正说明） ---------- */
  function renderSummary(s){
    ttsCancel();
    refreshTop(); clear(main); clear(optBox);
    main.appendChild(el('div','chapKicker','章 末 结 算'));
    main.appendChild(el('div','chapHead', esc(s.chapter.split('｜')[0].trim()) + ' 终'));
    main.appendChild(el('div','scoreHead','偏 离 归 因 ｜ 当前偏离 '+s.dev+'（'+esc(s.bandName)+'）'));
    if (s.devLog.length === 0){
      main.appendChild(el('div','sumEmpty','本章你循史而行，史官的笔尚跟得上你。'));
    } else {
      s.devLog.forEach(function(d){
        var it = el('div','reviewItem');
        it.innerHTML = '<div class="rr"><b>'+esc(d.ev)+'</b> ｜ '+esc(d.t.length>18?d.t.slice(0,18)+'…':d.t)+'</div><div class="rd">偏离 +'+d.dev+'</div>';
        main.appendChild(it);
      });
    }
    // 章末定制文案（GDD 3.1；引擎 notes 字段可能尚未就位，判空兼容）
    if (s.notes && s.notes.length){
      s.notes.forEach(function(n){ main.appendChild(el('div','noteSeg',esc(n))); });
    }
    main.appendChild(el('div','scoreHead','本 章 境 遇'));
    if (Object.keys(s.attrDelta).length === 0){
      main.appendChild(el('div','sumEmpty','六维如止水，无增无减。'));
    } else {
      game.d.ATTRS.forEach(function(a){
        var d = s.attrDelta[a.k];
        if (!d) return;
        var good = a.inverse ? d < 0 : d > 0;
        var val = game.diff.hideAttrs ? (game.attrWord(a.k) + '（' + (d > 0 ? '升' : '降') + '）') : ((d > 0 ? '+' : '') + d + ' → ' + game.attrs[a.k]);
        main.appendChild(el('div','scoreLine','<span>'+a.n+'</span><b style="color:'+(good?'#8fae7c':'#b0432f')+'">'+val+'</b>'));
      });
    }
    if (s.corrTitle) main.appendChild(el('div','sumEmpty','历史修正：'+esc(s.corrTitle)+'（见前文结算）'));
    var btn = el('button','bigBtn', s.nextTitle ? '进 入 下 一 章' : '继 续');
    btn.onclick = function(){ handleRoute(game.proceedSummary()); };
    optBox.appendChild(btn);
    main.scrollTop = 0;
  }

  /* ---------- 章末事件 ---------- */
  function renderEndEvent(){
    ttsCancel();
    refreshTop(); clear(main); clear(optBox);
    var ev = game.currentEndEvent;
    main.appendChild(el('div','evTitle', esc(ev.title)));
    revealSegs(ev.segs.map(function(s){ return { cls: 'seg', html: rich(s) }; }), function(){
      ev.options.forEach(function(o, i){
        var b = el('button','opt', esc(o.t));
        b.onclick = function(){
          disableOpts();
          var r = game.endEventChoose(i);
          showSettle('', r.text, r.changes, r.devDelta, null, null, function(){
            var n = game.proceedAfterEndEvent();
            handleRoute(n);
          });
        };
        optBox.appendChild(b);
      });
      speakMain();
    });
    main.scrollTop = 0;
  }

  /* ---------- 修正事件 ---------- */
  function showCorrection(c){
    showSettle(c.title, c.segs.join(''), c.changes, 0, null, null, function(){
      var n = game.correctionContinue();
      handleRoute(n);
    });
  }

  /* ---------- 结局页 ---------- */
  function renderEnding(){
    ttsCancel();
    var en = game.ending;
    saveCollection();
    clearGameSave();   // 达成结局，跨会话存档失效（GDD 6.4）
    refreshTop(); clear(main); clear(optBox); overlay.style.display='none';
    var sealBox = el('div','endSealBox');
    sealBox.innerHTML = '<img class="sealImg" src="assets/seals/'+(SEAL_IMG[en.seal]||'seal_xunshi')+'.png" alt="'+esc(en.seal)+'"><span class="sealMeta">'+esc(en.seal)+' · '+esc(en.diffName)+'难度</span>';
    main.appendChild(sealBox);
    main.appendChild(el('div','endName', esc(en.name)));
    if (en.achNew) main.appendChild(el('div','', '<span style="color:var(--gold);font-size:13px;border:1px dashed var(--gold);padding:5px 10px;display:inline-block;margin-bottom:16px">成就解锁 ｜ '+esc(en.achNew)+'</span>'));
    main.appendChild(el('div','endZhuan', esc(en.zhuan)));
    if (en.aliveNote) main.appendChild(el('div','sumEmpty',esc(en.aliveNote)));
    main.appendChild(el('div','scoreHead','评 分'));
    var rw = el('div','', ''); rw.id='radarWrap'; main.appendChild(rw);
    drawRadar(rw, en.scores);
    var names = {gongye:'功业', cuncun:'存续', shiping:'史评', yingxiang:'影响'};
    Object.keys(names).forEach(function(k){
      main.appendChild(el('div','scoreLine','<span>'+names[k]+'</span><b>'+en.scores[k]+'</b>'));
    });
    var tl = el('div','', ''); tl.id='totalLine';
    tl.innerHTML = '<span style="font-size:13px;color:var(--ink-dim)">总分（含难度与回溯系数）</span><span id="totalScore">'+en.total+'</span><span id="gradeBadge">'+en.grade+'</span>';
    main.appendChild(tl);
    main.appendChild(el('div','scoreHead','复 盘'));
    if (en.review.length === 0) main.appendChild(el('div','seg','这一局太短，短到历史还没有来得及转向。'));
    en.review.forEach(function(r, i){
      var d = el('div','reviewItem');
      d.innerHTML = '<div class="rn">抉择 '+ (i+1) +' ｜ '+esc(r.node)+'</div>'+
        '<div class="rr">你的选择：<b>'+esc(r.you)+'</b>'+(r.isHist?' <span style="opacity:.5">（同史实）</span>':'')+'<br>史实的选择：'+esc(r.hist)+'</div>'+
        '<div class="rd">偏离贡献 +'+(r.dev||0)+'</div>';
      main.appendChild(d);
    });
    var epi = el('div',''); epi.id='epilogue'; epi.textContent = en.epilogue; main.appendChild(epi);
    var again = el('button','bigBtn','再 入 此 局');
    again.onclick = function(){ var dk = game.diffKey; newGame(scenId(), dk); game.start(); renderIntro(); };
    main.appendChild(again);
    // 分享卡（GDD 11.3：结局页即分享卡，可保存为图片）
    var share = el('button','ghostBtn','分 享 此 局');
    share.onclick = function(){ showShareCard(en); };
    main.appendChild(share);
    if (game.diff.backtrack !== 0){
      var bt = el('button','ghostBtn','回 溯 至 本 章 开 头');
      bt.onclick = function(){ if (game.backtrack()) renderIntro(true); };
      main.appendChild(bt);
    }
    var home = el('button','ghostBtn','返 回 主 页');
    home.onclick = renderHome;
    main.appendChild(home);
    main.scrollTop = 0;
    ttsSpeak(en.name + '。' + en.zhuan);   // 结局史传朗读
  }

  function drawRadar(wrap, s){
    var size = 210, c = document.createElement('canvas');
    c.width = size; c.height = size;
    var ctx = c.getContext('2d');
    var cx = size/2, cy = size/2, R = 72;
    var keys = ['gongye','cuncun','shiping','yingxiang'];
    var labels = ['功业','存续','史评','影响'];
    ctx.strokeStyle = '#3a3226'; ctx.fillStyle = '#a89a7c';
    ctx.font = '12px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    [0.25,0.5,0.75,1].forEach(function(f){
      ctx.beginPath();
      for (var i=0;i<=4;i++){ var a=-Math.PI/2 + (i%4)*Math.PI/2; var x=cx+Math.cos(a)*R*f, y=cy+Math.sin(a)*R*f; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
      ctx.stroke();
    });
    for (var i=0;i<4;i++){
      var a=-Math.PI/2 + i*Math.PI/2;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R); ctx.stroke();
      ctx.fillText(labels[i], cx+Math.cos(a)*(R+20), cy+Math.sin(a)*(R+16));
    }
    ctx.beginPath();
    for (var i=0;i<=4;i++){
      var k = keys[i%4], a=-Math.PI/2 + (i%4)*Math.PI/2;
      var r = R * Math.max(0.03, s[k]/100);
      var x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle='rgba(201,169,89,.25)'; ctx.fill();
    ctx.strokeStyle='#c9a959'; ctx.stroke();
    wrap.appendChild(c);
  }

  /* ---------- 抽屉（属性面板 / 百科图鉴） ---------- */
  function openDrawer(mode){
    var heads = document.querySelectorAll('#drawerBody h3');
    var list = document.getElementById('attrList'); clear(list);
    var meta = document.getElementById('drawerMeta');
    var al = document.getElementById('achList');
    if (mode === 'attrs'){
      heads[0].textContent = '属 性 面 板';
      heads[1].style.display = ''; al.style.display = ''; meta.style.display = '';
      game.d.ATTRS.forEach(function(a){
        var row = el('div','attrRow');
        var valText = game.diff.hideAttrs ? game.attrWord(a.k) : (game.attrs[a.k] + ' · ' + game.attrWord(a.k));
        var pct = game.attrs[a.k];
        if (game.diff.hideAttrs){
          // 硬核（GDD 4.4）：条形不按真实百分比，按状态词命中档位四档均分渲染
          var tier = a.words.length - 1;
          for (var wi = 0; wi < a.words.length; wi++){ if (game.attrs[a.k] >= a.words[wi][0]){ tier = wi; break; } }
          pct = (a.words.length - tier) * (100 / a.words.length);
        }
        row.innerHTML = '<div class="lab"><span><img class="attrIcon" src="assets/icons/icon_'+a.k+'.png" alt="">'+a.n+'</span><span class="val">'+valText+'</span></div>'+
          '<div class="attrBar'+(a.inverse?' inv':'')+'"><i style="width:'+pct+'%"></i></div>';
        list.appendChild(row);
      });
      meta.innerHTML = '偏离度 '+game.dev+'（'+game.d.DEV_BANDS[game.devBand()].name+'）<br>难度 '+game.diff.n+' ｜ 功业标记：'+(game.merits.join('、')||'无');
      // 主敌威胁/戒心（隐藏值，剧本 HIDDEN 配置；硬核不显示）
      if (game.d.HIDDEN && game.diffKey !== 'hardcore' && game.chapterIdx >= (game.d.HIDDEN.showFrom != null ? game.d.HIDDEN.showFrom : 3)) meta.innerHTML += '<br>'+game.d.HIDDEN.name+'：'+game.zgWord();
      clear(al);
      if (game.ach.length===0) al.innerHTML = '<span style="opacity:.4;border:none">尚未解锁</span>';
      game.ach.forEach(function(a){
        var s = el('span','');
        s.innerHTML = '<img class="achIcon" src="assets/ach/ach_'+a+'.png" alt="">'+esc(game.d.ACHIEVEMENTS[a]);
        al.appendChild(s);
      });
    } else {
      heads[0].textContent = '百 科 图 鉴';
      heads[1].style.display = 'none'; al.style.display = 'none';
      meta.style.display = '';
      var total = Object.keys(game.d.GLOSSARY).length;
      meta.innerHTML = '已收录 '+game.gloss.length+' / '+total+' 条。叙事中带下划线的词条，点按即可收录。';
      Object.keys(game.d.GLOSSARY).forEach(function(t){
        var has = game.gloss.indexOf(t) >= 0;
        var b = el('button','glossItem'+(has?'':' glocked'), has ? esc(t) : '？？？');
        if (has) b.onclick = function(){ showGloss(t); };
        list.appendChild(b);
      });
    }
    document.getElementById('drawer').className='open';
  }
  document.getElementById('btnAttrs').onclick = function(){ openDrawer('attrs'); };
  document.getElementById('btnGloss').onclick = function(){ if (game) openDrawer('gloss'); };
  document.getElementById('drawerMask').onclick = function(){ document.getElementById('drawer').className=''; };
  document.getElementById('btnBack').onclick = function(){
    if (game && game.canBacktrack()){ game.backtrack(); renderIntro(true); }
  };

  /* ---------- 百科弹卡（点按词条即收录，GDD 5.6） ---------- */
  function showGloss(term){
    var g = game.d.GLOSSARY[term];
    if (!g || !game) return;
    var isNew = game.gloss.indexOf(term) < 0;
    if (isNew){ game.gloss.push(term); saveCollection(); }
    document.getElementById('glossTerm').textContent = term;
    document.getElementById('glossBody').textContent = g;
    var gc = document.getElementById('glossChar');
    if (CHAR_IMG[term]){ gc.src = 'assets/char/char_'+CHAR_IMG[term]+'.png'; gc.style.display = 'block'; }
    else { gc.style.display = 'none'; }
    document.getElementById('glossNew').style.display = isNew ? 'block' : 'none';
    document.getElementById('glossMask').className = 'open';
  }
  document.getElementById('glossClose').onclick = function(){ document.getElementById('glossMask').className=''; };
  document.getElementById('glossMask').onclick = function(e){ if (e.target === this) this.className=''; };
  function bindGloss(elm){
    elm.addEventListener('click', function(e){
      var t = e.target && e.target.closest ? e.target.closest('.gloss') : null;
      if (t) showGloss(t.getAttribute('data-t'));
    });
  }
  bindGloss(main);
  bindGloss(document.getElementById('settleText'));

  /* ---------- 结局分享卡（GDD 11.3：结局名 + 史传节选 + 评级，canvas 直出 PNG） ---------- */
  function wrapCanvasText(x, text, px, py, maxW, lh){
    var line = '', yy = py;
    for (var i = 0; i < text.length; i++){
      var t = line + text[i];
      if (x.measureText(t).width > maxW && line){ x.fillText(line, px, yy); line = text[i]; yy += lh; }
      else line = t;
    }
    if (line) x.fillText(line, px, yy);
    return yy;
  }
  function drawShareCard(en){
    var W = 480, H = 720, c = document.createElement('canvas');
    c.width = W; c.height = H;
    var x = c.getContext('2d');
    var SERIF = '"Noto Serif SC","Songti SC","STSong",serif';
    if (shareBg.complete && shareBg.naturalWidth) x.drawImage(shareBg, 0, 0, W, H);
    else { x.fillStyle = '#17140f'; x.fillRect(0, 0, W, H); }
    x.textAlign = 'center';
    x.fillStyle = '#a89a7c'; x.font = '16px ' + SERIF;
    x.fillText('青史生存录 · 李斯「仓鼠之局」', W / 2, 66);
    x.fillStyle = '#e8dfc8'; x.font = 'bold 42px ' + SERIF;
    x.fillText(en.name, W / 2, 132);
    x.fillStyle = '#b0432f'; x.font = '17px ' + SERIF;
    x.fillText(en.seal + ' · ' + en.diffName + '难度', W / 2, 166);
    x.strokeStyle = '#3a3226'; x.beginPath(); x.moveTo(60, 190); x.lineTo(W - 60, 190); x.stroke();
    x.fillStyle = '#c9b98f'; x.font = '15px ' + SERIF; x.textAlign = 'left';
    var zh = en.zhuan.length > 105 ? en.zhuan.slice(0, 105) + '……' : en.zhuan;
    wrapCanvasText(x, zh, 52, 222, W - 104, 27);
    // 评级圆章
    x.strokeStyle = '#b0432f'; x.lineWidth = 3;
    x.beginPath(); x.arc(W / 2, 500, 52, 0, Math.PI * 2); x.stroke();
    x.fillStyle = '#b0432f'; x.font = 'bold 52px ' + SERIF; x.textAlign = 'center';
    x.fillText(en.grade, W / 2, 518);
    x.fillStyle = '#c9a959'; x.font = '24px ' + SERIF;
    x.fillText('总分 ' + en.total, W / 2, 590);
    x.fillStyle = '#a89a7c'; x.font = '13px ' + SERIF;
    x.fillText('功业 ' + en.scores.gongye + ' ｜ 存续 ' + en.scores.cuncun + ' ｜ 史评 ' + en.scores.shiping + ' ｜ 影响 ' + en.scores.yingxiang, W / 2, 622);
    x.fillText('历史偏离度 ' + en.dev, W / 2, 650);
    x.fillStyle = '#7fa8a0'; x.font = '14px ' + SERIF;
    x.fillText('你的历史偏离度是多少？', W / 2, 684);
    return c.toDataURL('image/png');
  }
  function showShareCard(en){
    try {
      var url = drawShareCard(en);
      document.getElementById('shareImg').src = url;
      document.getElementById('shareDl').href = url;
      document.getElementById('shareDl').download = '青史生存录-' + en.name + '.png';
      document.getElementById('shareMask').className = 'open';
    } catch(e){}
  }
  document.getElementById('shareClose').onclick = function(){ document.getElementById('shareMask').className = ''; };
  document.getElementById('shareMask').onclick = function(e){ if (e.target === this) this.className = ''; };

  refreshTtsBtns();
  renderHome();
})();
</script>
